[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tephra-fallout-isopachs"
version = "0.14.0"
description = "Reproducible empirical tephra isopachs and probabilistic global fallout volumes"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy>=1.12", "pandas>=2", "matplotlib>=3.8", "contourpy>=1.2", "pyproj>=3.6", "shapely>=2.1,<3", "numpyro>=0.19,<0.23", "arviz>=0.22,<0.23"]

[project.optional-dependencies]
test = ["pytest>=8", "xlrd==2.0.2"]

[project.scripts]
tephra-isopachs = "src.empirical_isopach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.empirical_isopach" = ["assets/*.geojson.gz", "assets/*.json"]

[tool.setuptools.data-files]
"share/tephra-fallout-isopachs" = ["data/datasets.json", "data/README.md"]
"share/tephra-fallout-isopachs/eruptions" = ["data/eruptions/*.csv"]
"share/tephra-fallout-isopachs/audits/B-Tm" = ["data/audits/B-Tm/*.json", "data/audits/B-Tm/*.csv", "data/audits/B-Tm/*.md"]
"share/tephra-fallout-isopachs/audits/YTT" = ["data/audits/YTT/*.xlsx", "data/audits/YTT/*.json", "data/audits/YTT/*.csv", "data/audits/YTT/*.md"]

"share/tephra-fallout-isopachs/audits/YTT/sensitivity" = ["data/audits/YTT/sensitivity/*.csv"]

"share/tephra-fallout-isopachs/audits/Ilopango-TBJ" = ["data/audits/Ilopango-TBJ/*.json", "data/audits/Ilopango-TBJ/*.csv", "data/audits/Ilopango-TBJ/*.png", "data/audits/Ilopango-TBJ/README.md"]
"share/tephra-fallout-isopachs/audits/Sakurajima-Satsuma" = ["data/audits/Sakurajima-Satsuma/*.json", "data/audits/Sakurajima-Satsuma/*.csv", "data/audits/Sakurajima-Satsuma/*.png", "data/audits/Sakurajima-Satsuma/README.md"]
"share/tephra-fallout-isopachs/audits/Minoan" = ["data/audits/Minoan/*.json", "data/audits/Minoan/*.csv", "data/audits/Minoan/README.md"]
"share/tephra-fallout-isopachs/audits/Aso-4" = ["data/audits/Aso-4/*.json", "data/audits/Aso-4/*.csv", "data/audits/Aso-4/*.xlsx", "data/audits/Aso-4/README.md"]
"share/tephra-fallout-isopachs/sources/ilopango-tbj" = ["data/sources/ilopango-tbj/*.xls", "data/sources/ilopango-tbj/*.csv", "data/sources/ilopango-tbj/README.md"]
"share/tephra-fallout-isopachs/sources/sakurajima-satsuma" = ["data/sources/sakurajima-satsuma/*.xlsx", "data/sources/sakurajima-satsuma/*.csv", "data/sources/sakurajima-satsuma/*.json", "data/sources/sakurajima-satsuma/README.md"]
"share/tephra-fallout-isopachs/sources/minoan" = ["data/sources/minoan/*.xlsx", "data/sources/minoan/*.tsv", "data/sources/minoan/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
