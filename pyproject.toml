[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tephra-fallout-isopachs"
version = "0.11.1"
description = "Reproducible empirical tephra isopachs and probabilistic global fallout volumes"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy>=1.12", "pandas>=2", "matplotlib>=3.8", "contourpy>=1.2", "pyproj>=3.6", "shapely>=2.1,<3", "numpyro>=0.19,<0.23", "arviz>=0.22,<0.23"]

[project.optional-dependencies]
test = ["pytest>=8"]
legacy-map = ["basemap>=2"]

[project.scripts]
tephra-isopachs = "src.empirical_isopach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.probabilistic_isopach" = ["assets/*.geojson"]

[tool.setuptools.data-files]
"share/tephra-fallout-isopachs" = ["data/datasets.json", "data/README.md"]
"share/tephra-fallout-isopachs/eruptions" = ["data/eruptions/*.csv"]
"share/tephra-fallout-isopachs/audits/YTT" = ["data/audits/YTT/*.xlsx", "data/audits/YTT/*.json", "data/audits/YTT/*.csv", "data/audits/YTT/*.md"]

"share/tephra-fallout-isopachs/audits/YTT/sensitivity" = ["data/audits/YTT/sensitivity/*.csv"]

"share/tephra-fallout-isopachs/audits/Minoan" = ["data/audits/Minoan/*.json", "data/audits/Minoan/*.csv", "data/audits/Minoan/README.md"]
"share/tephra-fallout-isopachs/audits/Aso-4" = ["data/audits/Aso-4/*.json", "data/audits/Aso-4/*.csv", "data/audits/Aso-4/*.xlsx", "data/audits/Aso-4/README.md"]
"share/tephra-fallout-isopachs/sources/minoan" = ["data/sources/minoan/*.xlsx", "data/sources/minoan/*.tsv", "data/sources/minoan/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
