name: Publish verified Mazama calculations
on:
  push:
    branches: [codex/mazama-audit-20261122, codex/mazama-distal-facies-20261123]
    paths: [data/audits/Mazama/publication-request.json]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  PYTHONUNBUFFERED: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install '.[test]' openpyxl
      - name: Verify the original calculation and its complete set of model packets
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from benchmarks.mazama_sensitivity import CASES

          repo = os.environ['GITHUB_REPOSITORY']
          request = json.loads(pathlib.Path('data/audits/Mazama/publication-request.json').read_text())
          run = int(request['run_id'])
          endpoint = f'repos/{repo}/actions/runs/{run}'
          info = json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert info['head_sha'] == request['head_sha']
          assert info['name'] == 'Recompute audited Mazama'
          assert info['repository']['full_name'] == repo
          assert info['head_branch'] == os.environ['GITHUB_REF_NAME']
          path = 'data/eruptions/Mazama_reviewed.csv'
          src = subprocess.check_output(['git','show',info['head_sha']+':'+path])
          assert hashlib.sha256(src).hexdigest() == request['input_sha256']
          assert pathlib.Path(path).read_bytes() == src
          for script in ('mazama.py','mazama_recompute.py','mazama_sensitivity.py','mazama_phase_sensitivity.py','mazama_release.py'):
              filename = 'benchmarks/'+script
              assert pathlib.Path(filename).read_bytes() == subprocess.check_output(['git','show',info['head_sha']+':'+filename])
          names = subprocess.check_output(['gh','api','--paginate', endpoint+'/artifacts?per_page=100',
                                           '--jq','.artifacts[] | select(.expired == false) | .name'], text=True).splitlines()
          expected = {'principal-'+n for n in ('regional','directional','spherical-mixture','nested-isopachs')}
          expected |= {'source-'+n for n in CASES}
          if info['head_branch'] == 'codex/mazama-audit-20261122':
              expected.add('source-omit-williams')
          recovered = request.get('spherical_report')
          if recovered:
              repair_endpoint = f"repos/{repo}/actions/runs/{int(recovered['run_id'])}"
              repair = json.loads(subprocess.check_output(['gh','api',repair_endpoint]))
              assert repair['head_sha'] == recovered['head_sha'] and repair['conclusion'] == 'success'
              assert repair['name'] == 'Rebuild Mazama spherical report from verified fits'
              assert repair['head_branch'] == info['head_branch'] and repair['repository']['full_name'] == repo
              spec = json.loads(subprocess.check_output(['git','show',repair['head_sha']+':data/audits/Mazama/spherical-report-request.json']))
              assert all(spec[k] == request[k] for k in ('run_id','head_sha','input_sha256','observations'))
              outputs = subprocess.check_output(['gh','api',repair_endpoint+'/artifacts?per_page=100',
                  '--jq','.artifacts[] | select(.expired == false) | .name'],text=True).splitlines()
              assert outputs == ['principal-spherical-mixture']
              expected.remove('principal-spherical-mixture')
          available = {n for n in names if n.startswith(('principal-','source-'))}
          assert expected == available and all(names.count(n) == 1 for n in expected), sorted(expected ^ available)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print(f'run_id={run}',file=output)
              if recovered:
                  print(f"spherical_run={int(recovered['run_id'])}",file=output)
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: 'principal-*'
          path: results/packets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'source-*'
          path: results/packets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.spherical_run != ''
        with:
          name: principal-spherical-mixture
          path: results/packets
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.spherical_run }}
      - name: Assemble maps, conditional intervals and source comparisons
        env:
          SPHERICAL_REPORT_RUN: ${{ steps.source.outputs.spherical_run }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, tarfile
          target=Path('results/mazama-recompute')
          target.mkdir(parents=True,exist_ok=False)
          for archive in sorted(Path('results/packets').glob('*.tar.gz')):
              with tarfile.open(archive,'r:gz') as src:
                  src.extractall(target,filter='data')
          if os.environ['SPHERICAL_REPORT_RUN']:
              recovery=json.loads((target/'principal/spherical-mixture/report-recovery.json').read_text())
              request=json.loads(Path('data/audits/Mazama/publication-request.json').read_text())
              assert all(recovery['original_calculation'][k] == request[k] for k in ('run_id','head_sha','input_sha256'))
              assert len(recovery['source_cache_packets']) == 12 and len(recovery['verified_sampling_attempts']) >= 24
          PY
          python -m benchmarks.mazama_publish_run
      - name: Replay the reported evidence, figures and geographic validation
        run: |
          python -m benchmarks.mazama_release_check
          python data/audits/Mazama/validate_audit.py --published
          python -m benchmarks.verify_directional
          python -m benchmarks.verify_directional_ensemble
          python -m benchmarks.verify_spherical_bearings --check-history
          python -m benchmarks.verify_azimuth_continuation
          python -m benchmarks.verify_nested
          python -m benchmarks.verify_nested_reach
          python -m benchmarks.verify_extent
          python -m benchmarks.verify_visuals
          python scripts/check_repository_navigation.py
          python -m pytest -q
      - name: Publish the checked scientific results
        if: startsWith(github.ref, 'refs/heads/codex/mazama-')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- benchmarks/published-evidence.sha256 eruptions/mazama eruptions/README.md comparisons data/audits/Mazama/validation.json
          git diff --cached --stat
          git commit -m 'Publish audited Mazama maps, volume estimates, source tests and validation'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
