name: Refit spherical maps at reported minima
on:
  workflow_dispatch:
    inputs:
      case:
        description: Registered eruption slug with reported minima
        required: true
        type: string
permissions:
  contents: read
env:
  SLUG: ${{ inputs.case }}
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  posterior:
    name: ${{ inputs.case }} / ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        part: [baseline, wide_geography, five_fans, diffuse_tail, diffuse_mixture_weights, one_fan, gaussian_errors, volume_prior_shift, fold-0, fold-1, fold-2, fold-3]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            data
            benchmarks
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -u -m benchmarks.lower_limit_spherical "$SLUG" "$PART" --out packet
        env:
          PART: ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posterior-${{ inputs.case }}-${{ matrix.part }}
          path: packet/posteriors
          if-no-files-found: error
          retention-days: 7
  maps:
    name: Assemble ${{ inputs.case }}
    needs: posterior
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            data
            benchmarks
            pyproject.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: posterior-${{ inputs.case }}-*
          merge-multiple: true
          path: results/spherical-mixture/posteriors
      - run: python -u -m benchmarks.lower_limit_spherical "$SLUG" assemble --out results/spherical-mixture
      - uses: actions/upload-artifact@v4
        with:
          name: spherical-${{ inputs.case }}
          path: results/spherical-mixture
          retention-days: 7
