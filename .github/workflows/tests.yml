name: tests
on: [push, pull_request]
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - name: Check installed command and bundled data outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          tephra-isopachs --help
          python -c "from importlib.util import find_spec; from src.probabilistic_isopach.catalog import datasets, data_directory; rows = datasets(); assert len(rows) == 6; assert all(r['path'].is_file() for r in rows); assert (data_directory()/'audits/YTT/provenance.json').is_file(); assert (data_directory()/'audits/Minoan/provenance.json').is_file(); assert find_spec('src.probabilistic_isopach.workbench') is None; assert find_spec('src.probabilistic_isopach.atlas') is None"
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
