name: tests
on: [push, pull_request]
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - name: Replay Satsuma field, excavation and marine thickness evidence
        run: |
          python -m benchmarks.sakurajima_satsuma
          python -m benchmarks.satsuma_core_sensitivity --verify
      - name: Replay the Ilopango thickness audit from the original workbook
        run: python -m benchmarks.ilopango
      - name: Replay the Pinatubo Layer C source audit
        run: python -m benchmarks.pinatubo
      - name: Check repository navigation
        run: python scripts/check_repository_navigation.py
      - name: Check installed command and bundled data outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          tephra-isopachs --help
          tephra-isopachs methods
          tephra-isopachs compare --help
          tephra-isopachs global --help
          python -c "from src.empirical_isopach.models.registry import active_methods; assert active_methods() == ('stacked', 'spline')"
          python -c "from importlib.util import find_spec; from src.probabilistic_isopach.global_volume import EarthDomain; assert 5.1e8 < EarthDomain.wgs84(36).describe()['surface_area_km2'] < 5.2e8; from src.probabilistic_isopach.catalog import datasets, data_directory; rows = datasets(); assert len({r['slug'] for r in rows}) == len(rows); assert {'aso-4', 'b-tm', 'ilopango-tbj', 'mazama', 'minoan', 'pinatubo-1991-layer-c', 'sakurajima-satsuma', 'tambora', 'ytt'} <= {r['slug'] for r in rows}; assert all(r['path'].is_file() for r in rows); assert (data_directory()/'audits/YTT/provenance.json').is_file(); assert (data_directory()/'audits/Minoan/provenance.json').is_file(); assert find_spec('src.probabilistic_isopach.workbench') is None; assert find_spec('src.probabilistic_isopach.atlas') is None"
          python -c "from src.empirical_isopach.core.catalog import datasets; from src.empirical_isopach.models.mass_mixture.source_protocol import protocol; assert next(r for r in datasets() if r['slug'] == 'b-tm')['global_geometry'] == 'source-fans'; assert protocol('source-fans')[0].source_anchored; assert protocol('source-envelope')[0].supported_basis; assert not protocol('displaced')[0].source_anchored"
          python -c "from src.empirical_isopach.core.catalog import datasets, data_directory, resolve_dataset; from src.empirical_isopach.models.mass_mixture.study import audited_data; assert all((data_directory()/r['audit']).is_file() for r in datasets() if 'audit' in r); data, meta = audited_data(resolve_dataset('Aso-4')); assert len(data.xy) == 87 and data.censored.sum() == 4 and data.lower_censored.sum() == 3"
          python -c "from src.empirical_isopach.visualization.maps import ASSET, coast_rings; assert ASSET.is_file() and (ASSET.parent/'coastline-source.json').is_file(); assert len(coast_rings()) > 1000"
          python - <<'PYTHON'
          import json
          from hashlib import sha256
          from pathlib import Path
          from src.empirical_isopach.core.catalog import data_directory, datasets

          from src.empirical_isopach.core.audit import audited_data
          from src.empirical_isopach.models.directional.archive_readings import load_inventory

          root = data_directory()
          pinatubo = next(r for r in datasets() if r["slug"] == "pinatubo-1991-layer-c")
          data, meta = audited_data(pinatubo["path"])
          assert (len(data.xy), int((~data.censored).sum()), int(data.lower_censored.sum())) == (194, 143, 23)
          principal = json.loads((root / pinatubo["audit"]).read_text())["cases"]["principal"]
          assert meta["input_sha256"] == principal["sha256"]
          archive, _ = load_inventory(pinatubo["path"])
          assert len(archive["sites"]) == 102 and not archive["scenarios"]
          for case in (r for r in datasets() if r["slug"] in {"ilopango-tbj", "sakurajima-satsuma"}):
              audit = json.loads((root / case["audit"]).read_text())
              for source in audit["sources"]:
                  bundled = root / Path(source["file"]).relative_to("data")
                  assert sha256(bundled.read_bytes()).hexdigest() == source["sha256"]
              assert sha256(case["path"].read_bytes()).hexdigest() == audit["cases"]["principal"]["sha256"]
          PYTHON
      - name: Verify B-Tm evidence, source sensitivities and thinning comparisons
        run: python -m benchmarks.verify_btm_audit
      - name: Verify retained Aso-4 evidence and posterior checksums
        run: python -m benchmarks.verify_aso_evidence
      - name: Verify directional policy fits and whole-Earth mass budgets
        run: python -m benchmarks.verify_directional
      - name: Verify ensemble medians, joint fields and geographic calibration
        run: python -m benchmarks.verify_directional_ensemble
      - name: Verify spherical bearing continuation, mass and missing-fan tests
        run: |
          git fetch --no-tags --depth=1 origin 843a2eef0fc669e38d95e4153ac8d7464f4d4a98
          python -m benchmarks.verify_spherical_bearings --check-history
      - name: Verify visual revisions preserve scientific evidence
        run: python -m benchmarks.verify_visuals
      - name: Verify directional extent and archive sensitivity
        run: python -m benchmarks.verify_azimuth_continuation
      - name: Replay nested reach and independent field survey predictions
        run: python -m benchmarks.verify_nested_reach
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
